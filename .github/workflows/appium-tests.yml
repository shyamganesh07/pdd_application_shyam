name: Appium E2E Mobile App Frontend Test Automation

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  appium-e2e-tests:
    name: Execute Appium 500+ Mobile Test Cases & Generate Excel Summary
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code Repository
        uses: actions/checkout@v4

      - name: Setup Node.js Environment
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install Appium Tests Dependencies
        run: |
          cd appium-tests
          npm install

      - name: Run Appium Mobile E2E 500+ Test Suite & Excel Generator
        run: |
          cd appium-tests
          npm test

      - name: Upload Excel & CSV Mobile Test Reports Artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: Appium_E2E_500_Test_Results
          path: appium-tests/reports/
          retention-days: 30
