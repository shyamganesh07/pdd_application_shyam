name: Load & Performance Automation Testing

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  load-tests:
    name: Execute Load 500+ Test Cases & Generate Excel Summary
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code Repository
        uses: actions/checkout@v4

      - name: Setup Node.js Environment
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install Load Tests Dependencies
        run: |
          cd load-tests
          npm install

      - name: Run Load 500+ Test Suite & Excel Generator
        run: |
          cd load-tests
          npm test

      - name: Upload Excel & CSV Load Test Reports Artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: Load_E2E_500_Test_Results
          path: load-tests/reports/
          retention-days: 30
